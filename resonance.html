<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RESONANCE</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;500;700&display=swap');

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    background: #050505;
    color: #e0e0e0;
    font-family: 'JetBrains Mono', monospace;
    overflow: hidden;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  #game-container {
    position: relative;
    width: 100vw;
    height: 100vh;
  }

  canvas {
    display: block;
    background: #050505;
  }

  #ui {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 24px 32px;
  }

  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }

  .score-box {
    text-align: right;
  }

  .label {
    font-size: 11px;
    letter-spacing: 3px;
    color: #666;
    text-transform: uppercase;
  }

  .value {
    font-size: 28px;
    font-weight: 700;
    color: #00f0ff;
    text-shadow: 0 0 12px rgba(0, 240, 255, 0.4);
  }

  .combo {
    color: #ff00aa;
    text-shadow: 0 0 12px rgba(255, 0, 170, 0.5);
  }

  #start-screen, #game-over {
    position: absolute;
    inset: 0;
    background: rgba(5, 5, 5, 0.92);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    pointer-events: all;
    z-index: 10;
  }

  h1 {
    font-size: 48px;
    font-weight: 300;
    letter-spacing: 12px;
    color: #00f0ff;
    text-shadow: 0 0 30px rgba(0, 240, 255, 0.3);
    margin-bottom: 8px;
  }

  .subtitle {
    font-size: 13px;
    letter-spacing: 4px;
    color: #666;
    margin-bottom: 48px;
  }

  .btn {
    background: transparent;
    border: 1px solid #00f0ff;
    color: #00f0ff;
    padding: 14px 42px;
    font-family: inherit;
    font-size: 13px;
    letter-spacing: 3px;
    cursor: pointer;
    transition: all 0.25s ease;
    text-transform: uppercase;
  }

  .btn:hover {
    background: #00f0ff;
    color: #050505;
    box-shadow: 0 0 30px rgba(0, 240, 255, 0.4);
  }

  .instructions {
    margin-top: 40px;
    font-size: 12px;
    color: #555;
    text-align: center;
    line-height: 1.8;
    max-width: 320px;
  }

  .final-score {
    font-size: 64px;
    font-weight: 700;
    color: #00f0ff;
    margin: 16px 0 8px;
  }

  .hidden {
    display: none !important;
  }
</style>
</head>
<body>
  <div id="game-container">
    <canvas id="c"></canvas>

    <div id="ui">
      <div class="top-bar">
        <div>
          <div class="label">RESONANCE</div>
        </div>
        <div class="score-box">
          <div class="label">SCORE</div>
          <div class="value" id="score">0</div>
          <div class="label" style="margin-top:8px">COMBO</div>
          <div class="value combo" id="combo">x1</div>
        </div>
      </div>
    </div>

    <div id="start-screen">
      <h1>RESONANCE</h1>
      <div class="subtitle">PULSE // TIMING // FLOW</div>
      <button class="btn" id="start-btn">INICIAR</button>
      <div class="instructions">
        Mova o mouse para controlar o núcleo<br>
        Clique para emitir um pulso<br>
        Acerte os orbes no momento certo<br>
        Construa combos. Não erre.
      </div>
    </div>

    <div id="game-over" class="hidden">
      <div class="label">SINAL PERDIDO</div>
      <div class="final-score" id="final-score">0</div>
      <div class="label" style="margin-bottom:32px">PONTOS</div>
      <button class="btn" id="retry-btn">REINICIAR</button>
    </div>
  </div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const comboEl = document.getElementById('combo');
const startScreen = document.getElementById('start-screen');
const gameOverScreen = document.getElementById('game-over');
const finalScoreEl = document.getElementById('final-score');

let W, H;
let mouse = { x: 0, y: 0 };
let core = { x: 0, y: 0, radius: 8 };
let pulses = [];
let orbs = [];
let particles = [];
let score = 0;
let combo = 1;
let comboTimer = 0;
let gameState = 'start'; // start | playing | over
let spawnTimer = 0;
let time = 0;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  core.x = W / 2;
  core.y = H / 2;
}
window.addEventListener('resize', resize);
resize();

canvas.addEventListener('mousemove', e => {
  mouse.x = e.clientX;
  mouse.y = e.clientY;
});

canvas.addEventListener('click', () => {
  if (gameState !== 'playing') return;
  pulses.push({
    x: core.x,
    y: core.y,
    radius: 0,
    max: 180 + Math.random() * 60,
    life: 1,
    speed: 4.2
  });
});

document.getElementById('start-btn').addEventListener('click', startGame);
document.getElementById('retry-btn').addEventListener('click', startGame);

function startGame() {
  score = 0;
  combo = 1;
  comboTimer = 0;
  pulses = [];
  orbs = [];
  particles = [];
  spawnTimer = 0;
  gameState = 'playing';
  startScreen.classList.add('hidden');
  gameOverScreen.classList.add('hidden');
  scoreEl.textContent = '0';
  comboEl.textContent = 'x1';
}

function spawnOrb() {
  const angle = Math.random() * Math.PI * 2;
  const dist = 220 + Math.random() * Math.min(W, H) * 0.35;
  orbs.push({
    x: core.x + Math.cos(angle) * dist,
    y: core.y + Math.sin(angle) * dist,
    radius: 6 + Math.random() * 4,
    life: 1,
    hit: false,
    vx: (Math.random() - 0.5) * 0.4,
    vy: (Math.random() - 0.5) * 0.4,
    pulsePhase: Math.random() * Math.PI * 2
  });
}

function createParticles(x, y, color, count = 12) {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 1 + Math.random() * 3;
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 1,
      color,
      size: 1 + Math.random() * 2
    });
  }
}

function update() {
  if (gameState !== 'playing') return;

  time++;
  // core follows mouse with lag
  core.x += (mouse.x - core.x) * 0.12;
  core.y += (mouse.y - core.y) * 0.12;

  // pulses
  for (let i = pulses.length - 1; i >= 0; i--) {
    const p = pulses[i];
    p.radius += p.speed;
    p.life = 1 - (p.radius / p.max);
    if (p.life <= 0) pulses.splice(i, 1);
  }

  // spawn orbs
  spawnTimer++;
  if (spawnTimer > 50 - Math.min(30, score / 80)) {
    spawnOrb();
    spawnTimer = 0;
  }

  // orbs
  for (let i = orbs.length - 1; i >= 0; i--) {
    const o = orbs[i];
    o.x += o.vx;
    o.y += o.vy;
    o.pulsePhase += 0.06;
    o.life -= 0.0018;

    // check collision with pulses
    for (const p of pulses) {
      const dx = o.x - p.x;
      const dy = o.y - p.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (Math.abs(dist - p.radius) < o.radius + 8 && !o.hit) {
        o.hit = true;
        const accuracy = 1 - Math.abs(dist - p.radius) / 12;
        const points = Math.floor(10 * combo * (0.6 + accuracy));
        score += points;
        combo = Math.min(combo + 0.5, 8);
        comboTimer = 120;
        createParticles(o.x, o.y, '#00f0ff', 16);
        createParticles(o.x, o.y, '#ff00aa', 8);
        scoreEl.textContent = score;
        comboEl.textContent = 'x' + combo.toFixed(1);
      }
    }

    if (o.life <= 0 || o.hit) {
      if (!o.hit) {
        // missed orb penalty
        combo = Math.max(1, combo - 1);
        comboEl.textContent = 'x' + combo.toFixed(1);
        createParticles(o.x, o.y, '#ff3366', 6);
      }
      orbs.splice(i, 1);
    }
  }

  // combo decay
  if (comboTimer > 0) {
    comboTimer--;
  } else if (combo > 1) {
    combo = Math.max(1, combo - 0.02);
    comboEl.textContent = 'x' + combo.toFixed(1);
  }

  // particles
  for (let i = particles.length - 1; i >= 0; i--) {
    const pt = particles[i];
    pt.x += pt.vx;
    pt.y += pt.vy;
    pt.vx *= 0.96;
    pt.vy *= 0.96;
    pt.life -= 0.025;
    if (pt.life <= 0) particles.splice(i, 1);
  }

  // soft fail condition (too many missed orbs in short time is already handled by combo)
  if (orbs.length > 18) {
    endGame();
  }
}

function endGame() {
  gameState = 'over';
  finalScoreEl.textContent = score;
  gameOverScreen.classList.remove('hidden');
}

function draw() {
  ctx.fillStyle = 'rgba(5, 5, 5, 0.22)';
  ctx.fillRect(0, 0, W, H);

  // subtle grid
  ctx.strokeStyle = 'rgba(0, 240, 255, 0.03)';
  ctx.lineWidth = 1;
  const grid = 60;
  for (let x = 0; x < W; x += grid) {
    ctx.beginPath();
    ctx.moveTo(x, 0);
    ctx.lineTo(x, H);
    ctx.stroke();
  }
  for (let y = 0; y < H; y += grid) {
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(W, y);
    ctx.stroke();
  }

  // particles
  for (const pt of particles) {
    ctx.beginPath();
    ctx.arc(pt.x, pt.y, pt.size * pt.life, 0, Math.PI * 2);
    ctx.fillStyle = pt.color;
    ctx.globalAlpha = pt.life;
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // pulses
  for (const p of pulses) {
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
    ctx.strokeStyle = `rgba(0, 240, 255, ${p.life * 0.7})`;
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(p.x, p.y, p.radius * 0.7, 0, Math.PI * 2);
    ctx.strokeStyle = `rgba(255, 0, 170, ${p.life * 0.25})`;
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  // orbs
  for (const o of orbs) {
    const pulse = 0.7 + Math.sin(o.pulsePhase) * 0.3;
    ctx.beginPath();
    ctx.arc(o.x, o.y, o.radius * pulse, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(0, 240, 255, ${o.life * 0.9})`;
    ctx.shadowColor = '#00f0ff';
    ctx.shadowBlur = 15;
    ctx.fill();
    ctx.shadowBlur = 0;

    // outer ring
    ctx.beginPath();
    ctx.arc(o.x, o.y, o.radius * 1.8, 0, Math.PI * 2);
    ctx.strokeStyle = `rgba(0, 240, 255, ${o.life * 0.15})`;
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  // core
  const corePulse = 1 + Math.sin(time * 0.08) * 0.15;
  ctx.beginPath();
  ctx.arc(core.x, core.y, core.radius * corePulse, 0, Math.PI * 2);
  ctx.fillStyle = '#00f0ff';
  ctx.shadowColor = '#00f0ff';
  ctx.shadowBlur = 20;
  ctx.fill();

  ctx.beginPath();
  ctx.arc(core.x, core.y, core.radius * 2.2, 0, Math.PI * 2);
  ctx.strokeStyle = 'rgba(0, 240, 255, 0.25)';
  ctx.lineWidth = 1;
  ctx.stroke();

  ctx.beginPath();
  ctx.arc(core.x, core.y, core.radius * 3.5, 0, Math.PI * 2);
  ctx.strokeStyle = 'rgba(255, 0, 170, 0.08)';
  ctx.stroke();
  ctx.shadowBlur = 0;
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
